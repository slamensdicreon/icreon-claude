name: CI

on:
  push:
    # The default branch is the release branch; there is no main.
    branches: [main, claude/sharp-pascal-3u2qg0]
  pull_request:

# Read the code, nothing more: CI writes nowhere.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser tool server's tests and the web app's browser checks drive a real Chromium
      # (one install: both use the same playwright-core).
      # Its system packages come from Ubuntu's mirrors; when the runner can't reach them (an
      # outage on GitHub's side, as on 2026-11-11), install Chromium alone rather than block
      # every pull request: the runner image already carries what it needs to start.
      - run: >-
          pnpm --filter @lw/tool-browser exec playwright-core install --with-deps chromium
          || pnpm --filter @lw/tool-browser exec playwright-core install chromium
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # The web app in a real browser, against the API's simulator (Playwright starts both).
      - run: pnpm --filter @lw/web e2e --trace off
