# Playbook manifest for the homepage demo on Optimizely CMS (SaaS): the homepage demo's scope and
# method on the Optimizely team and platform model. Discovery audits the whole site in numbers; the
# Blueprint and the build cover only the homepage, the header, the footer and the navigation,
# through parity and deploy. It runs on our own instance and closes at Gate 2, when the Director
# checks a marketer can compose and edit the page in Visual Builder; a signed client's build starts
# from scratch on optimizely-saas-migration. Plan: docs/architecture/homepage-demo-playbook.md.
#
# What the platform changes: components are content types defined in code (every key carries the
# project's prefix) with display templates, the page is an experience type that references shared
# header, footer and navigation blocks, the team creates the demo's application itself through the
# REST API, and delivery is Optimizely Graph, which serves published content only.
#
# 0.1.1: the build repository's starter generates its component registry from the component
# folders and carries no samples, so a component is one folder and branches built at the same time
# never edit the same file; the prompts say so.
# 0.1.2: a key that has already published content on the instance is not asked for its content
# rights, and names an earlier build holds are settled as one decision: continue it, or reset.
# 0.1.3: Discovery and the Blueprint are checked as on SitecoreAI (what the source site has that
# would otherwise surface mid-build, and the model contract at Gate 1), the shared header, footer
# and navigation are checked for content, and page titles against the source's.
id: optimizely-homepage-demo
version: 0.1.3
name: Optimizely homepage demo
description: >-
  Audits a prospect's whole site in numbers, then blueprints and builds their homepage,
  header, footer and navigation on Optimizely CMS (SaaS), through parity and deploy, so a marketer
  can compose, edit and publish it in Visual Builder. Runs on our demo instance and closes when the
  homepage is reviewed.
platform: optimizely
charter:
  mission: >-
    Show a prospect their own homepage on Optimizely CMS (SaaS), built the way we would build their
    whole site, so a marketer can compose and edit it in Visual Builder without a developer. Audit
    the whole site; build only the homepage, the header, the footer and the navigation.
  outcomes:
    - id: compose-and-edit
      title: Marketers add, edit and publish sections on the homepage
      measure: >-
        Every homepage component is a content type carrying the project's prefix, offered as a
        section in Visual Builder with a default display template of its own, edits inline in live
        preview, and a section added to the page holds its own content (types.pushed,
        editor.element-enabled, head.preview-route), confirmed by the Director's Visual Builder
        check at Gate 2.
    - id: shared-chrome
      title: The header, footer and navigation are the marketer's
      measure: >-
        The header, footer and navigation are shared blocks the homepage's experience type
        references; the navigation is its own block whose menu items a marketer edits once for
        every page (head.header-footer, parity.chrome).
    - id: homepage-parity
      title: The homepage looks and reads like the live site
      measure: >-
        The homepage passes render, visual parity at three breakpoints, and content
        parity against the source (parity.render, parity.visual, parity.page).
    - id: deployed
      title: Deployed and published
      measure: >-
        The reviewed commit runs on the editing and delivery hosts, the content model replays from
        the repository (a clean optimizely-cms-cli config push --dryRun builds what the CMS
        holds), and the homepage is published, indexed in Optimizely Graph and resolves on the
        application's primary host (deploy.commit-matches, manifest.replays, graph.published,
        routes.resolve).
    - id: real-audit
      title: The audit covers the whole site in numbers
      measure: >-
        The discovery crawl covers the whole site and the page inventory's siteAudit records it:
        pages, page layouts, forms, languages and sites, with any floor said as one. The Blueprint
        covers only what the demo builds (discovery.inventory, blueprint.coverage,
        blueprint.demo-slice).
intake:
  source:
    repo: optional
    url: optional
    intro: >-
      The prospect's live site (and their repository, if they shared it). Agents read the code when there is a
      repository; without one they rebuild from the live site's rendered markup and styles. The new
      site is built in a repository of its own.
  steps:
    - title: Optimizely CMS (SaaS)
      intro: >-
        Our demo instance, through its saved connection. Name the demo's own application and the
        prefix its content types carry; every demo gets its own of each, because content types are
        shared by every application on the instance. The team creates the application itself. The
        API key needs content rights as well as API access: in the CMS, Settings > Set Access
        Rights, on the Root, give the key Read, Create, Change, Delete and Publish. Without them it
        can push content types and is still refused every content write; the first step of the run
        asks you to confirm them, before Gate 1.
      fields: [cmsUrl, application, typePrefix, languages]
      credentials:
        - { id: cms-api-client, required: true }
    - title: Optimizely Graph and hosting
      intro: >-
        The Graph keys the head reads content with, and the Vercel project it deploys to. The app
        key and secret are optional now and can be added later in Settings.
      fields: [hostingProject]
      credentials:
        - { id: graph-single-key, required: true }
        - { id: graph-hmac }
  brief:
    - key: rights
      label: Image and copy rights
      kind: text
      hint: >-
        The demo shows the prospect's own copy and images on our instance's preview. Note anything
        that must not be used.
    - key: codeExtraction
      label: May agents read and reuse the source code?
      kind: choice
      options: [Yes, Structure only (no copy or assets from code), No]
      required: true
      when: source-repo
defaults:
  concurrency: 8
  # Who may settle each category of card. The Lead settles the categories it can (it sees the
  # Blueprint, the rules, the project's decisions and the team's lessons) and forwards to the
  # Director what is theirs; a Director can set any category back to shadow or ask in Settings.
  # Five projects' shadow answers showed the Lead right or nearly right on most retry,
  # ownership and naming cards. Access, scope, releases and anything unclassified always ask.
  autonomy:
    media: lead
    tool: lead
    retry: lead
    ownership: lead
    naming: lead
    content: lead
    access: ask
    scope: ask
    release: ask
    other: ask
  # One page and its chrome, after a whole-site audit. A starting point until timed runs.
  budgets:
    tokens: 20000000
    usd: 300
    hours: 10
  escalationDeadlines:
    blocker: 4h
    decision: 1h
    access: 4h
    budget: 1h
    risk: 24h
    gate: 24h
  escalationPolicy:
    blocker:
      { default: false, behaviour: Pauses that path. No default, notifies: 'Immediately, Slack' }
    access: { default: true, behaviour: Proceeds with the default, notifies: 'Immediately, Slack' }
    decision:
      { default: true, behaviour: Proceeds with the default, notifies: 'Digest, unless under 2 h' }
    gate: { default: false, behaviour: Waits for you. No default, notifies: 'Immediately, Slack' }
    budget:
      { default: false, behaviour: Pauses dispatch. No default, notifies: 'Immediately, email' }
    risk: { default: true, behaviour: Proceeds; logged, notifies: Digest }
  stats:
    - {
        metric: components_registered,
        label: Content types,
        icon: application,
        note: Pushed to the CMS and offered in Visual Builder,
      }
    - { metric: pages_migrated, label: Pages, icon: document, note: The homepage }
    - { metric: media_uploaded, label: Media, icon: image, note: Uploaded with alt text }
    - { metric: qa_pass, label: QA pass, icon: task--complete, note: Of content types pushed }
  toolLabels:
    browser: Browser
    validators: Validators
    artifacts: Workbench
    blackboard: Blackboard
    decision-log: Decision Log
    model: Model
    plan: Planner
    optimizely-cms: CMS REST API
    optimizely-graph: Optimizely Graph
    github: GitHub
    build-repo: Build repo
    sandbox: Sandbox
    hosting: Vercel
    research: Docs
phases:
  - number: 0
    name: Intake and access verification
    shortName: Intake
    exitCriteria: >-
      Every credential verified against its endpoint (GitHub clone, CMS REST API v1, Optimizely
      Graph, hosting); instance facts recorded (applications, locales, content types already
      carrying the prefix); the Director has confirmed the API key's content rights on the Root
      (no read shows them, and the first content write comes after Gate 1); the application and
      prefix the demo owns are fixed, and other applications on the instance are left alone.
  - number: 1
    name: Discovery and analysis
    shortName: Discovery
    exitCriteria: >-
      The whole site crawled and audited in numbers (the page inventory's siteAudit); the homepage
      inventoried in full; the components, design system and assets of the homepage, header,
      footer and navigation inventoried.
  - number: 2
    name: Blueprint
    shortName: Blueprint
    gate: director
    gateLabel: 'Gate 1: Director approves the Blueprint'
    exitCriteria: >-
      A Blueprint for the homepage only: its experience type, every component on it with its
      model contract (the content type key with the prefix, properties, display templates and
      their settings), the header, the footer and the navigation as its own shared block, and
      their media. No other pages.
  # The application is not made here: it needs its start page to exist, and the start page is the
  # homepage, of the experience type the Blueprint names. That type reaches the CMS in phase 5.
  - number: 3
    name: Foundation
    shortName: Foundation
    exitCriteria: >-
      Design tokens and shared primitives extracted from the source; the hosting project and its
      variables exist and the head answers on Vercel, with Vercel Authentication off so Visual
      Builder can frame it; zero critical findings.
  - number: 4
    name: Component build and content types
    shortName: Components
    exitCriteria: >-
      Every component in the demo slice built (content type, display templates and React
      component), its types pushed to the CMS under the project's prefix, and its code on the
      editing address. The header, footer and navigation first: the experience type, the
      application and the shared content wait only on them.
  - number: 5
    name: Experience type, application and site shell
    shortName: Templates
    dependsOn:
      - 3
    exitCriteria: >-
      The homepage's experience type pushed; the demo's application exists with the homepage as
      its start page, assets of its own and the production address as its primary host and the editing address as its preview host, with live preview;
      the shared header, footer and navigation blocks filled from the source, referenced by the
      homepage and published; every slice component proven ready for Visual Builder.
  - number: 6
    name: Homepage migration and parity
    shortName: Migration
    dependsOn:
      - 4
      - 5
    exitCriteria: >-
      Homepage content and its media in the CMS and published on the demo's own host; render,
      visual and content parity pass on the homepage.
  - number: 7
    name: Experience enablement
    shortName: Experience
    exitCriteria: >-
      The homepage's SEO properties set from the source.
  - number: 8
    name: Deployment and publishing
    shortName: Deployment
    exitCriteria: >-
      The deployed commit is the reviewed commit on the editing and delivery hosts; the content
      model replays from the repository; the final versions of the homepage and its shared blocks
      are published and indexed in Optimizely Graph, and the homepage resolves on the
      application's primary host.
  # The demo closes on the Director's check in Visual Builder (agents have no Visual Builder
  # sign-in), which is also the script for the meeting.
  - number: 9
    name: Demo review
    shortName: Review
    gate: director
    gateLabel: 'Gate 2: Director runs the Visual Builder check'
    exitCriteria: >-
      Demo summary delivered; the Director has added a section to the homepage in Visual Builder,
      edited it inline in live preview, edited a navigation link, published, and seen both changes
      on the site; every failure has gone back to its task and passed; the Director accepts and
      the demo closes.
