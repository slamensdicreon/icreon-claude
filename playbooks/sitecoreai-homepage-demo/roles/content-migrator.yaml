role: content-migrator
name: Content Migrator
persona: 'Leila Hassan'
description: 'Creates pages and data items from the source content, places components on each page, and rewrites internal links.'
tier: specialist
reportsTo: content-lead
workstream: content
runtime: messages
model:
  id: claude-sonnet-5-5
  effort: medium
mandate: >-
  Create pages from templates, compose placeholders with renderings and datasources, create Data folder
  items, convert rich text, rewrite internal links.
produces:
  - migrated pages and data items
tools:
  sitecore-authoring:
    ops:
      - item.read
      - item.create
      - item.update
      - layout.compose
      # A page's own photos, from the source page (sourceUrl), when no media task uploaded them.
      - media.upload
    scope:
      paths:
        - '{sitePath}/Home/**'
        - '{sitePath}/Data/**'
        - /sitecore/media library/Project/{project}/**
      # Template and rendering IDs to compose with: read only.
      readPaths:
        - /sitecore/templates/**
        - /sitecore/layout/**
        - '{sitePath}/**'
  browser:
    ops:
      # The source page's copy and structure, so content is migrated, never invented.
      - snapshot
      # Images set by CSS (a hero's or section's background) aren't in a snapshot: computed styles give their URL.
      - page.styles
      # A page's own images on a host other than the source site (its CDN, a SitecoreAI source's
      # edge.sitecorecloud.io): media.upload takes only source-site URLs, so download first and upload the ref.
      - fetch.asset
      # The page's content as its CMS delivered it (fields, images, links, lists the page builds
      # in the browser), when it embeds its layout data: Next.js sites on Sitecore do.
      - page.data
  # The source repository, where a site built from code keeps its copy (content files).
  github:
    ops:
      - tree.read
      - repo.read
      - code.search
  blackboard:
    ops:
      - read
  artifacts:
    ops:
      - read
      # A large site's proven template mapping (template-mapping-<key>), for the bulk import.
      - write
  # Reproduce a page on the head and read what the server logged (a 500 names what threw).
  hosting:
    ops:
      - logs.runtime
  # The project's facts: what other tasks made (IDs, paths), and what this one publishes.
  facts:
    ops:
      - read
      - publish
  # The task's own acceptance checks, run before submitting.
  acceptance:
    ops:
      - check
acceptance:
  - validator:structural.layouts
  - validator:head.pages-render
  - validator:parity.page
escalateWhen:
  - rejectedTwice
  - accessDenied
  - retriesExhausted
knowledge:
  - known-pitfalls
activePhases:
  - 6
