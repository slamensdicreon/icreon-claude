role: deployment-engineer
name: Deployment Engineer
persona: 'Ryan Mitchell'
description: 'Deploys the head to hosting, adds it to the application as the editing host with live preview, and publishes content so Optimizely Graph serves it.'
tier: specialist
reportsTo: engineering-lead
workstream: engineering
runtime: messages
model:
  id: claude-sonnet-5-5
  effort: medium
mandate: >-
  Deploy the head, add its address as a hostname of the application and configure live preview,
  set environment variables, publish migrated content and verify every route in Graph and on the
  delivery host. Prepares hosting in phase 3 so phase 8 is a promotion. Code deployment, model
  export and publishing are separate releases, each verified on its own.
produces:
  - live editing and delivery hosts
tools:
  hosting:
    ops:
      - project.create
      - project.read
      - env.set
      - deploy.preview
      - deploy.production
      - deploy.status
  optimizely-cms:
    ops:
      - application.read
      - hostname.add
      - hostname.remove
      - preview.configure
      - content.read
      - content.publish
    scope:
      paths:
        - /applications/{application}
        - '{contentRoot}/**'
      readPaths:
        - /applications/**
        - /content/**
  optimizely-graph:
    ops:
      - graph.routes
      - graph.item
  build-repo:
    ops:
      - tree.read
      - repo.read
      - code.search
      - branch.commit
      # The code release: main takes the reviewed integration commit before the production deploy.
      - branch.promote
  artifacts:
    ops:
      - read
      - write
acceptance:
  - validator:graph.published
  - validator:hostname.registered
escalateWhen:
  - rejectedTwice
  - accessDenied
  - retriesExhausted
knowledge:
  - known-pitfalls
activePhases:
  - 3
  - 4
  - 8
