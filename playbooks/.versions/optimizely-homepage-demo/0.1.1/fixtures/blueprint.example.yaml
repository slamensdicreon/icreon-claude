# Example Blueprint for the homepage demo on Optimizely CMS (SaaS): the homepage of a large
# software company's site, as the proof project built it on a live instance (its 19 content types
# and 11 display templates, less the error message component, which the demo doesn't build). The
# homepage's experience type, the components on it, the header, footer and navigation as shared
# blocks, and their media. The rest of the
# site is the page inventory's audit, not the Blueprint's. One image on the homepage that won't
# move (an expired campaign banner) is dropped with its reason.
#
# What the example shows of the platform's model: every key carries the project's prefix (Acme
# here); every component has a default display template of its own; a variant is a display
# template (Featured Banner: Promo, Feature, Message); what varies per placement is a setting
# (the band's tone, the hero tab, Horizontal Card's image side); repeating items are inline child
# types with a limit.
version: 1
collections:
  components:
    - key: site-header
      name: Site Header
      pilot: true
      attrs:
        contentType: AcmeSiteHeader
        behaviour: shell
        content: shared
        shared: true
        pages: ['/']
    - key: main-navigation
      name: Main Navigation
      pilot: true
      attrs:
        contentType: AcmeMainNavigation
        behaviour: shell
        content: shared
        shared: true
        pages: ['/']
        children: { contentType: AcmeNavGroup, max: 8 }
    - key: site-footer
      name: Site Footer
      pilot: true
      attrs:
        contentType: AcmeSiteFooter
        behaviour: shell
        content: shared
        shared: true
        pages: ['/']
        children: { contentType: AcmeFooterColumn, max: 6 }
    - key: announcement-banner
      name: Announcement Banner
      pilot: true
      attrs:
        contentType: AcmeAnnouncementBanner
        behaviour: section
        content: page
        pages: ['/']
        displayTemplates:
          - {
              key: AcmeAnnouncementBannerDefault,
              name: Default,
              default: true,
              settings: { tone: [none, navy] },
            }
    - key: hero-with-tabs
      name: Hero with Tabs
      pilot: true
      attrs:
        contentType: AcmeHeroWithTabs
        behaviour: section
        content: page
        pages: ['/']
        displayTemplates:
          - {
              key: AcmeHeroWithTabsDefault,
              name: Default,
              default: true,
              settings: { tone: [none] },
            }
    - key: promo-card-carousel
      name: Promo Card Carousel
      pilot: true
      attrs:
        contentType: AcmePromoCardCarousel
        behaviour: section
        content: page
        pages: ['/']
        children: { contentType: AcmePromoCard, max: 12 }
        displayTemplates:
          - {
              key: AcmePromoCardCarouselDefault,
              name: Default,
              default: true,
              settings: { tone: [none, faint], tab: [all, personal, business] },
            }
    - key: quick-links
      name: Quick Links
      pilot: true
      attrs:
        contentType: AcmeQuickLinks
        behaviour: section
        content: page
        pages: ['/']
        children: { contentType: AcmeQuickLink, max: 8 }
        displayTemplates:
          - {
              key: AcmeQuickLinksDefault,
              name: Default,
              default: true,
              settings: { tone: [none, faint], tab: [all, personal, business] },
            }
    - key: featured-banner
      name: Featured Banner
      pilot: true
      attrs:
        contentType: AcmeFeaturedBanner
        behaviour: section
        content: page
        pages: ['/']
        # One display template per variant of the source component.
        displayTemplates:
          - key: AcmeFeaturedBannerPromo
            name: Promo
            default: true
            settings: { tone: [none, navy], tab: [all, personal, business], headingLevel: [h2, h1] }
          - key: AcmeFeaturedBannerFeature
            name: Feature
            settings: { tone: [none, navy], tab: [all, personal, business], headingLevel: [h2, h1] }
          - key: AcmeFeaturedBannerMessage
            name: Message
            settings: { tone: [none, navy], tab: [all, personal, business], headingLevel: [h2, h1] }
    - key: feature-card-grid
      name: Feature Card Grid
      pilot: true
      attrs:
        contentType: AcmeFeatureCardGrid
        behaviour: section
        content: page
        pages: ['/']
        children: { contentType: AcmeFeatureCard, max: 6 }
        displayTemplates:
          - {
              key: AcmeFeatureCardGridDefault,
              name: Default,
              default: true,
              settings: { tone: [none, faint] },
            }
    - key: horizontal-card
      name: Horizontal Card
      pilot: true
      attrs:
        contentType: AcmeHorizontalCard
        behaviour: section
        content: page
        pages: ['/']
        # Image left or right is a setting of the one template, not a second template.
        displayTemplates:
          - {
              key: AcmeHorizontalCardDefault,
              name: Default,
              default: true,
              settings: { tone: [none, faint], imageSide: [left, right] },
            }
    - key: social-follow
      name: Social Follow
      pilot: true
      attrs:
        contentType: AcmeSocialFollow
        behaviour: section
        content: page
        pages: ['/']
        children: { contentType: AcmeSocialLink, max: 8 }
        displayTemplates:
          - {
              key: AcmeSocialFollowDefault,
              name: Default,
              default: true,
              settings: { tone: [none, faint] },
            }
  templates:
    - key: experience
      name: Experience
      attrs:
        kind: experience
        contentType: AcmeExperience
        shell:
          - { property: header, component: site-header }
          - { property: footer, component: site-footer }
  pages:
    - key: home
      name: Home
      attrs: { path: '/', template: experience }
    - key: not-found
      name: Page not found
      status: drop
      attrs: { path: '/404', errorPage: 404, reason: The homepage demo builds no 404 page }

  media:
    - key: campaign-banner
      name: campaign-2019.jpg
      status: drop
      attrs: { pages: ['/'], reason: Expired 2019 campaign banner; won't move }
    - key: logo-header
      name: header-logo.png
      attrs: { pages: ['/'], shared: true }
    - key: hero-background
      name: home-hero-background.webp
      attrs: { pages: ['/'] }
    - key: promo-card-1
      name: home-promo-card-1.webp
      attrs: { pages: ['/'] }
    - key: feature-card-1
      name: home-feature-card-1.webp
      attrs: { pages: ['/'] }
    - key: social-icon-1
      name: social-icon-1.webp
      attrs: { pages: ['/'] }
