# Example Blueprint for demos and tests: a mid-size corporate site with a blog, on Optimizely.
#
# It is written to this platform's model contract, as the Solution Architect's prompt asks for
# it, and passes the checks the Blueprint step names (blueprint.coverage, discovery.blueprint):
# every key carries the project's prefix (Acme here); each component has its properties with
# their types, its composition behaviour and a default display template of its own; repeating
# items are child types with a limit; the header, footer and navigation are shared blocks; three
# sections the home page shows are the pilot. Each page is on a page type, one source URL that
# redirects is kept as a parent with its redirect, and the 404 page is left to the head.
version: 1
collections:
  components:
    - key: hero
      name: Hero
      pilot: true
      attrs:
        contentType: AcmeHero
        behaviour: section
        content: page
        properties:
          [
            { name: heading, type: string, required: true, localized: true },
            { name: text, type: richText, localized: true },
            { name: image, type: contentReference, allowedTypes: [_image] },
            { name: cta, type: link },
          ]
        displayTemplates:
          - { key: AcmeHeroDefault, name: Default, default: true, settings: { tone: [none, navy] } }
        # The source names this block HeroBanner in the layout data its pages embed.
        sourceComponents: [HeroBanner]
    - key: promo-card
      name: PromoCard
      pilot: true
      attrs:
        contentType: AcmePromoCard
        behaviour: both
        content: page
        properties:
          [
            { name: title, type: string, required: true },
            { name: text, type: richText },
            { name: image, type: contentReference, allowedTypes: [_image] },
            { name: link, type: link },
          ]
        displayTemplates:
          - {
              key: AcmePromoCardDefault,
              name: Default,
              default: true,
              settings: { imageSide: [left, right] },
            }
    - key: rich-text
      name: RichText
      pilot: true
      attrs:
        contentType: AcmeRichText
        behaviour: both
        content: page
        properties: [{ name: body, type: richText, required: true, localized: true }]
        displayTemplates:
          - { key: AcmeRichTextDefault, name: Default, default: true }
    - key: header
      name: Header
      attrs:
        contentType: AcmeHeader
        # A shared block the page types refer to: built with the pilot, never added to a page.
        behaviour: shell
        content: shared
        shared: true
        properties:
          - { name: logo, type: contentReference, allowedTypes: [_image] }
          - { name: navigation, type: contentReference, allowedTypes: [AcmeNavigation] }
          - { name: cta, type: link }
    - key: footer
      name: Footer
      attrs:
        contentType: AcmeFooter
        behaviour: shell
        content: shared
        shared: true
        properties:
          [
            { name: logo, type: contentReference, allowedTypes: [_image] },
            { name: legal, type: richText },
          ]
        children:
          contentType: AcmeFooterColumn
          max: 6
          properties: [{ name: heading, type: string }, { name: links, type: array }]
        # Every form on the source is accounted for. This one doesn't move.
        forms:
          - id: newsletter
            pages: ['*']
            drop: The newsletter sign-up moved to the client’s email platform; the footer links to it
    - key: card-grid
      name: CardGrid
      attrs:
        contentType: AcmeCardGrid
        behaviour: section
        content: page
        properties: [{ name: heading, type: string }]
        children:
          contentType: AcmeCard
          max: 12
          properties:
            [
              { name: title, type: string },
              { name: text, type: richText },
              { name: image, type: contentReference, allowedTypes: [_image] },
              { name: link, type: link },
            ]
        # One display template per layout the source shows; the column count is a setting.
        displayTemplates:
          - {
              key: AcmeCardGridDefault,
              name: Default,
              default: true,
              settings: { columns: ['2', '3', '4'] },
            }
          - { key: AcmeCardGridPanel, name: Panel, layout: '1 tall panel left, 2 stacked right' }
    - key: testimonial
      name: Testimonial
      attrs:
        contentType: AcmeTestimonial
        behaviour: both
        content: page
        properties:
          [
            { name: quote, type: richText, required: true },
            { name: name, type: string },
            { name: role, type: string },
            { name: photo, type: contentReference, allowedTypes: [_image] },
          ]
        displayTemplates:
          - { key: AcmeTestimonialDefault, name: Default, default: true }
    - key: cta-banner
      name: CtaBanner
      attrs:
        contentType: AcmeCtaBanner
        behaviour: section
        content: page
        properties:
          [
            { name: heading, type: string, required: true },
            { name: text, type: richText },
            { name: cta, type: link },
          ]
        displayTemplates:
          - {
              key: AcmeCtaBannerDefault,
              name: Default,
              default: true,
              settings: { tone: [none, navy, red] },
            }
    - key: accordion
      name: Accordion
      attrs:
        contentType: AcmeAccordion
        behaviour: section
        content: page
        properties: [{ name: heading, type: string }]
        children:
          contentType: AcmeAccordionItem
          max: 20
          properties: [{ name: question, type: string }, { name: answer, type: richText }]
        displayTemplates:
          - { key: AcmeAccordionDefault, name: Default, default: true }
    - key: tabs
      name: Tabs
      attrs:
        contentType: AcmeTabs
        behaviour: section
        content: page
        children:
          contentType: AcmeTab
          max: 6
          properties: [{ name: label, type: string }, { name: body, type: richText }]
        displayTemplates:
          - { key: AcmeTabsDefault, name: Default, default: true }
    - key: image-gallery
      name: ImageGallery
      attrs:
        contentType: AcmeImageGallery
        behaviour: section
        content: page
        properties: [{ name: heading, type: string }]
        children:
          contentType: AcmeGalleryImage
          max: 24
          properties:
            [
              { name: image, type: contentReference, allowedTypes: [_image] },
              { name: caption, type: string },
            ]
        displayTemplates:
          - { key: AcmeImageGalleryDefault, name: Default, default: true }
    - key: video-embed
      name: VideoEmbed
      attrs:
        contentType: AcmeVideoEmbed
        behaviour: both
        content: page
        properties:
          [
            { name: heading, type: string },
            { name: video, type: url, required: true },
            { name: poster, type: contentReference, allowedTypes: [_image] },
          ]
        displayTemplates:
          - { key: AcmeVideoEmbedDefault, name: Default, default: true }
    - key: navigation
      name: Navigation
      status: merge
      attrs:
        contentType: AcmeNavigation
        # A consolidation on record: the source's main and utility menus become this one block.
        # It names no mergedInto, so it is still built, as its own shared block.
        consolidates: [main menu, utility menu]
        behaviour: shell
        content: shared
        shared: true
        children:
          contentType: AcmeNavigationGroup
          max: 8
          properties: [{ name: label, type: string }, { name: links, type: array }]
    - key: breadcrumb
      name: Breadcrumb
      attrs:
        contentType: AcmeBreadcrumb
        behaviour: element
        content: page
        properties: [{ name: showHome, type: boolean }]
        displayTemplates:
          - { key: AcmeBreadcrumbDefault, name: Default, default: true }
    - key: stats-strip
      name: StatsStrip
      attrs:
        contentType: AcmeStatsStrip
        behaviour: section
        content: page
        children:
          contentType: AcmeStat
          max: 6
          properties: [{ name: value, type: string }, { name: label, type: string }]
        displayTemplates:
          - {
              key: AcmeStatsStripDefault,
              name: Default,
              default: true,
              settings: { tone: [none, faint] },
            }
    - key: logo-wall
      name: LogoWall
      attrs:
        contentType: AcmeLogoWall
        behaviour: section
        content: page
        properties: [{ name: heading, type: string }]
        children:
          contentType: AcmeLogo
          max: 24
          properties:
            [
              { name: logo, type: contentReference, allowedTypes: [_image] },
              { name: link, type: link },
            ]
        displayTemplates:
          - { key: AcmeLogoWallDefault, name: Default, default: true }
  # Page types. An experience is composed freely in Visual Builder; a page is a fixed form.
  templates:
    - key: home
      name: Home Page
      attrs:
        kind: experience
        contentType: AcmeHomePage
        properties:
          [
            { name: metaTitle, type: string, localized: true },
            { name: metaDescription, type: string, localized: true },
          ]
        defaultSections: [hero, promo-card, rich-text]
    - key: landing
      name: Landing Page
      attrs:
        kind: experience
        contentType: AcmeLandingPage
        properties:
          [
            { name: metaTitle, type: string, localized: true },
            { name: metaDescription, type: string, localized: true },
          ]
        defaultSections: [hero, card-grid, cta-banner]
    - key: article
      name: Article Page
      attrs:
        kind: page
        contentType: AcmeArticlePage
        properties:
          [
            { name: metaTitle, type: string, localized: true },
            { name: metaDescription, type: string, localized: true },
          ]
    - key: listing
      name: Listing Page
      attrs:
        kind: experience
        contentType: AcmeListingPage
        properties:
          [
            { name: metaTitle, type: string, localized: true },
            { name: metaDescription, type: string, localized: true },
          ]
        defaultSections: [hero, card-grid]
    - key: blog-post
      name: Blog Post
      attrs:
        kind: page
        contentType: AcmeBlogPost
        properties:
          [
            { name: metaTitle, type: string, localized: true },
            { name: metaDescription, type: string, localized: true },
          ]
  pages:
