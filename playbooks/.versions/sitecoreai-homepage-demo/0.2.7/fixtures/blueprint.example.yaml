# Example Blueprint for the homepage demo: the homepage of a mid-size corporate site, its
# template, the components on them, the header, footer and navigation, and their media.
# The rest of the site is the page inventory's audit, not the Blueprint's. One item on the homepage
# that won't move (an expired campaign banner) is dropped with its reason.
version: 1
collections:
  components:
    - key: header
      name: Header
      pilot: true
      attrs: { datasource: shared, pages: ['/'] }
    - key: navigation
      name: Navigation
      pilot: true
      attrs: { datasource: shared, pages: ['/'] }
    - key: footer
      name: Footer
      pilot: true
      attrs: { datasource: shared, pages: ['/'] }
    - key: hero
      name: Hero
      pilot: true
      attrs: { variants: [{ name: Default, pages: ['/', '/about'] }] }
    - key: card-grid
      name: CardGrid
      pilot: true
      attrs: { variants: [{ name: Default, pages: ['/', '/services'] }] }
    - key: stats-strip
      name: StatsStrip
      pilot: true
      attrs: { variants: [{ name: Default, pages: ['/'] }] }
    - key: rich-text
      name: RichText
      pilot: true
      attrs: { variants: [{ name: Default, pages: ['/', '/about'] }] }
  templates:
    - key: home
      name: Home Page
  pages:
    - key: home
      name: Home
      attrs: { path: '/', template: home }
    - key: not-found
      name: Page not found
      status: drop
      attrs: { path: '/404', errorPage: 404, reason: The homepage demo builds no 404 page }

  media:
    - key: campaign-banner
      name: campaign-2019.jpg
      status: drop
      attrs: { pages: ['/'], reason: Expired 2019 campaign banner; won't move }
    - key: logo
      name: logo.svg
      attrs: { pages: ['/'], shared: true }
    - key: hero-home
      name: hero-home.jpg
      attrs: { pages: ['/'] }
    - key: card-1
      name: card-1.jpg
      attrs: { pages: ['/'] }
