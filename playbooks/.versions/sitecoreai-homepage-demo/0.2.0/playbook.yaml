# Playbook manifest for the homepage demo: the website playbook's team and method on a two-page
# scope. Discovery audits the whole site in numbers; the Blueprint and the build cover only the
# homepage, the 404 page, the header, the footer and the navigation, through parity and deploy. It runs on our own tenant and closes at Gate 2; a signed
# client's build starts from scratch on sitecoreai-migration. Plan: docs/architecture/homepage-demo-playbook.md.
id: sitecoreai-homepage-demo
version: 0.2.0
name: SitecoreAI homepage demo
description: >-
  Audits a prospect's whole site in numbers, then blueprints and builds their homepage, 404 page,
  header, footer and navigation on SitecoreAI, through parity and deploy, so a marketer can drag, drop and
  edit it in Page builder. Runs on our demo tenant and closes when the homepage is reviewed.
platform: sitecoreai
charter:
  mission: >-
    Show a prospect their own homepage on SitecoreAI, built the way we would build their whole
    site, so a marketer can assemble and edit it in Page builder without a developer. Audit the
    whole site; build only the homepage, the 404 page, the header, the footer and the navigation.
  outcomes:
    - id: drag-and-drop
      title: Marketers drag, drop and edit components on the homepage
      measure: >-
        Every homepage component is in the Page builder toolbox and allowed in the homepage's
        placeholders, edits inline, and creates its own datasource with starter content when
        dragged onto the page (structural.renderings, editor.component-enabled,
        editor.new-datasource), confirmed by the Director's drag-and-drop check at Gate 2.
    - id: shared-chrome
      title: The header, footer and navigation are the marketer's
      measure: >-
        Header and footer partial designs on shared datasources; the navigation is its own
        component whose menu items a marketer edits once for every page (head.header-footer).
    - id: homepage-parity
      title: The homepage looks and reads like the live site
      measure: >-
        The homepage and the 404 page pass render, visual parity at three breakpoints, and content
        parity against the source (parity.render, parity.visual, parity.page).
    - id: deployed
      title: Deployed and published
      measure: >-
        The reviewed commit runs on the editing and delivery hosts, the homepage is published to
        Experience Edge and resolves (deploy.commit-matches, editing-host.responds, edge.published,
        routes.resolve).
    - id: real-audit
      title: The audit covers the whole site in numbers
      measure: >-
        The discovery crawl covers the whole site and the page inventory's siteAudit records it:
        pages, page layouts, forms, languages and sites, with any floor said as one. The Blueprint
        covers only what the demo builds (blueprint.coverage, blueprint.demo-slice).
intake:
  source:
    repo: optional
    url: optional
    intro: >-
      The prospect's live site (and their repository, if they shared it). Agents read the code when there is a
      repository; without one they rebuild from the live site's rendered markup and styles. The new
      site is built in a repository of its own.
  steps:
    - title: SitecoreAI
      intro: >-
        Our demo tenant, through its saved connection. Create the demo's own site in SitecoreAI
        Sites first (agents can't create sites) and name it here; every demo gets its own site.
      fields: [cmHost, siteCollection, site, languages]
      credentials:
        - { id: sitecore-environment, required: true }
        - { id: sitecore-organization }
    - title: Edge and hosting
      intro: >-
        Experience Edge Context IDs for the new head, and the Vercel project it deploys to. The
        Context IDs are optional now and can be added later in Settings.
      fields: [hostingProject]
      credentials:
        - { id: edge-preview }
        - { id: edge-live }
        - { id: editing-secret }
  brief:
    - key: rights
      label: Image and copy rights
      kind: text
      hint: >-
        The demo shows the prospect's own copy and images on our tenant's preview. Note anything
        that must not be used.
    - key: codeExtraction
      label: May agents read and reuse the source code?
      kind: choice
      options: [Yes, Structure only (no copy or assets from code), No]
      required: true
      when: source-repo
defaults:
  concurrency: 8
  # Who may settle each category of card. The Lead settles the categories it can (it sees the
  # Blueprint, the rules, the project's decisions and the team's lessons) and forwards to the
  # Director what is theirs; a Director can set any category back to shadow or ask in Settings.
  # Five projects' shadow answers showed the Lead right or nearly right on most retry,
  # ownership and naming cards. Access, scope, releases and anything unclassified always ask.
  autonomy:
    media: lead
    tool: lead
    retry: lead
    ownership: lead
    naming: lead
    content: lead
    access: ask
    scope: ask
    release: ask
    other: ask
  # One page and its chrome, after a whole-site audit. A starting point until timed runs (M0).
  budgets:
    tokens: 20000000
    usd: 300
    hours: 10
  escalationDeadlines:
    blocker: 4h
    decision: 1h
    access: 4h
    budget: 1h
    risk: 24h
    gate: 24h
  escalationPolicy:
    blocker:
      { default: false, behaviour: Pauses that path. No default, notifies: 'Immediately, Slack' }
    access: { default: true, behaviour: Proceeds with the default, notifies: 'Immediately, Slack' }
    decision:
      { default: true, behaviour: Proceeds with the default, notifies: 'Digest, unless under 2 h' }
    gate: { default: false, behaviour: Waits for you. No default, notifies: 'Immediately, Slack' }
    budget:
      { default: false, behaviour: Pauses dispatch. No default, notifies: 'Immediately, email' }
    risk: { default: true, behaviour: Proceeds; logged, notifies: Digest }
  stats:
    - {
        metric: components_registered,
        label: Renderings,
        icon: application,
        note: Registered in SitecoreAI,
      }
    - { metric: pages_migrated, label: Pages, icon: document, note: Homepage and 404 }
    - { metric: media_uploaded, label: Media, icon: image, note: Uploaded with alt text }
    - { metric: qa_pass, label: QA pass, icon: task--complete, note: Of renderings registered }
  toolLabels:
    browser: Browser
    validators: Validators
    artifacts: Workbench
    blackboard: Blackboard
    decision-log: Decision Log
    model: Model
    plan: Planner
    sitecore-authoring: Authoring API
    sitecore-cli: Sitecore CLI
    sitecore-deploy: Deploy API
    github: GitHub
    build-repo: Build repo
    sandbox: Sandbox
    hosting: Vercel
    research: Docs
phases:
  - number: 0
    name: Intake and access verification
    shortName: Intake
    exitCriteria: >-
      Every credential verified against its endpoint; the demo's own site on our tenant named and
      found; the paths the project owns fixed, and other sites sharing the collection left alone.
  - number: 1
    name: Discovery and analysis
    shortName: Discovery
    exitCriteria: >-
      The whole site crawled and audited in numbers (the page inventory's siteAudit); the homepage
      and the 404 page inventoried in full; the components, design system and assets of the
      homepage, 404 page, header, footer and navigation inventoried.
  - number: 2
    name: Blueprint
    shortName: Blueprint
    gate: director
    gateLabel: 'Gate 1: Director approves the Blueprint'
    exitCriteria: >-
      A Blueprint for the homepage and the 404 page only: their templates, every component on them
      with its model contract, the header, footer and the navigation as its own shared component,
      and their media. No other pages.
  - number: 3
    name: Foundation
    shortName: Foundation
    exitCriteria: >-
      Languages and the project's own folders exist on the demo site; design tokens and shared
      primitives extracted from the source; hosting project and env vars exist; the rendering host key
      is identical in xmcloud.build.json and the host record; an empty page renders on the editing
      host; zero critical findings.
  - number: 4
    name: Component build and registration
    shortName: Components
    exitCriteria: >-
      Every component in the demo slice ported, registered, integrated into the editing host and
      offered in Page builder with its own datasource; the site on its own editing host.
  - number: 5
    name: Templates, layouts, and designs
    shortName: Templates
    dependsOn:
      - 3
    exitCriteria: >-
      The homepage's and 404's templates have standard values, insert options and placeholder settings
      that allow every slice component, and an assigned page design; header and footer partial
      designs, with the navigation, render on both.
  - number: 6
    name: Homepage migration and parity
    shortName: Migration
    dependsOn:
      - 4
      - 5
    exitCriteria: >-
      Homepage and 404 content and their media in SitecoreAI; header, footer and navigation
      datasources filled from the source; render, visual and content parity pass on both pages.
  - number: 7
    name: Experience enablement
    shortName: Experience
    exitCriteria: >-
      Homepage components datasource-driven; the homepage's SEO fields set; the site's 404 page set.
  - number: 8
    name: Deployment and publishing
    shortName: Deployment
    exitCriteria: >-
      The deployed commit is the reviewed commit on the registered editing and delivery hosts; the
      publish job finished and the homepage and 404 resolve on Experience Edge.
  # The demo closes on the Director's drag-and-drop check in Page builder (agents have no Pages
  # sign-in), which is also the script for the meeting.
  - number: 9
    name: Demo review
    shortName: Review
    gate: director
    gateLabel: 'Gate 2: Director runs the drag-and-drop check'
    exitCriteria: >-
      Demo summary delivered; the Director has dragged a component onto the homepage, edited it
      inline, edited a navigation link, published, and seen both changes on the preview URL; every
      failure has gone back to its task and passed; the Director accepts and the demo closes.
