# Task templates for the SitecoreAI replatform. The plan compiler expands them over the approved
# Blueprint's collections: components, templates, pages, media. Before Gate 1 each forEach
# template shows as one placeholder task, so the whole plan is visible from day one.

pilot:
  phase: 4
  collection: components
  optionalGate: pilot-slice-review
  # The rest of the build waits until the slice is proven through publishing and Page builder.
  # The site moves to its own editing host once the pilot components are integrated into it.
  verify: [switch-editing-host, prove-pilot-slice]

templates:
  # 0 — Intake and access verification
  - id: verify-access
    phase: 0
    role: deployment-engineer
    title: Verify credentials and record tenant facts
    acceptance: [validator:credentials.verified]

  # 1 — Discovery and analysis
  - id: inventory-repo
    phase: 1
    role: repo-analyst
    title: Inventory components, routes and assets
    when: source-repo
    uses: [github, artifacts]
  # No source repository: the live site is the source, read as rendered.
  - id: inventory-live-ui
    phase: 1
    role: repo-analyst
    title: Inventory components and design system from the live site
    unless: source-repo
    uses: [browser, artifacts]
  - id: crawl-site
    phase: 1
    role: content-analyst
    title: Crawl the source site and build the page inventory
  - id: platform-notes
    phase: 1
    role: research-agent
    title: Verify platform facts and write Platform Notes

  # 2 — Blueprint
  - id: draft-blueprint
    phase: 2
    role: solution-architect
    title: Draft the Implementation Blueprint
    dependsOn: [inventory-repo, inventory-live-ui, crawl-site, platform-notes]
    acceptance: [validator:blueprint.coverage]

  # 3 — Foundation
  - id: create-site
    phase: 3
    role: deployment-engineer
    title: Create site collection, site, languages and module folders
  - id: design-system
    phase: 3
    role: component-engineer
    title: Extract the design system (tokens, type, spacing, primitives)
  - id: prepare-hosting
    phase: 3
    role: deployment-engineer
    title: Deploy the head to Vercel and register it as the editing host
    release:
      rollback: >-
        Delete the editing host registration in the Deploy app and the Vercel project; nothing
        is published and no content changes.
    acceptance: [validator:editing-host.responds]
  - id: validate-foundation
    phase: 3
    role: structural-validator
    title: Validate the site skeleton
    dependsOn: [create-site]
    acceptance: [validator:structural.site]

  # 4 — Component build and registration
  - id: port-{key}
    phase: 4
    role: component-engineer
    forEach: components
    title: Port {name} to Content SDK
    dependsOn: [design-system]
    acceptance: [validator:build.green, validator:component-map.registered, validator:head.sections]
  - id: register-{key}
    phase: 4
    role: rendering-registrar
    forEach: components
    title: Register {name}
    dependsOn: ['port-{key}']
    acceptance:
      [
        validator:structural.renderings,
        validator:editor.component-enabled,
        validator:structural.component-queries,
      ]
    metric: components_registered
  - id: integrate-head
    phase: 4
    role: head-integrator
    title: Configure the head as the editing host
    dependsOn: [prepare-hosting]
    acceptance: [validator:head.editing-scripts]
  # Each component is built on its own branch. Page builder only offers components the editing
  # host's code has, so each accepted component joins one integration branch, deployed at the
  # project's fixed editing address.
  - id: integrate-{key}
    phase: 4
    role: head-integrator
    forEach: components
    title: Integrate {name} into the editing host
    dependsOn: ['register-{key}', integrate-head]
    acceptance: [validator:editing-host.deployed, validator:head.editing-scripts]
  - id: switch-editing-host
    phase: 4
    role: deployment-engineer
    title: Point the site at its own editing host
    # And on the pilot components' integrations (the pilot's verify list adds them).
    dependsOn: [integrate-head]
    release:
      rollback: >-
        Set the site's Site Grouping rendering host back to the value the result names; the new
        rendering host item can stay, nothing else uses it.
    acceptance: [validator:rendering-host.set]
  - id: prove-pilot-slice
    phase: 4
    role: editor-experience-qa
    title: Prove the pilot slice end to end (publish, Experience Edge, Page builder)
    dependsOn: [switch-editing-host]
    # Until an agent can work in Page builder (M7), the Director does this by hand.
    manual: >-
      In Page builder on the site: open the home page, add each pilot component from the toolbox,
      create a new datasource for it and edit a field inline, save, publish, and check the page on
      Experience Edge shows the change. Mark it done saying what you checked.
    acceptance:
      [
        validator:edge.published,
        validator:editor.component-enabled,
        validator:editor.new-datasource,
      ]
  - id: validate-components
    phase: 4
    role: structural-validator
    title: Validate renderings and Available Renderings
    dependsOn: [register-*]
    acceptance: [validator:structural.renderings]

  # 5 — Templates, layouts and designs
  - id: partial-designs
    phase: 5
    role: rendering-registrar
    title: Create header and footer partial designs
    # Partial designs bind the header's and footer's renderings: they must be registered first.
    dependsOn: [register-*]
    acceptance: [validator:head.header-footer]
  - id: template-{key}
    phase: 5
    role: rendering-registrar
    forEach: templates
    title: Create {name} template and page design
    dependsOn: [partial-designs]
  - id: validate-templates
    phase: 5
    role: structural-validator
    title: Validate templates and designs
    dependsOn: [template-*]
    acceptance: [validator:structural.templates]

  # 6 — Content and media migration
  - id: migrate-pages-{key}
    phase: 6
    role: content-migrator
    forEach: pages
    batchSize: 8
    title: Migrate {name}
    metric: pages_migrated
    acceptance:
      [
        validator:structural.layouts,
        validator:head.pages-render,
        validator:parity.render,
        validator:parity.visual,
      ]
  - id: upload-media-{key}
    phase: 6
    role: media-migrator
    forEach: media
    batchSize: 20
    title: Upload {name}
    metric: media_uploaded
  - id: recrawl-source
    phase: 6
    role: content-analyst
    title: Re-crawl the source for parity
  - id: audit-parity
    phase: 6
    role: parity-auditor
    title: Audit content parity
    dependsOn: [migrate-pages-*, upload-media-*, recrawl-source]
    acceptance: [validator:parity.render, validator:parity.visual, validator:parity.page]

  # 7 — Experience enablement
  - id: enable-experience
    phase: 7
    role: experience-enabler
    title: Redirects, SEO, sitemap, robots, error pages and dictionary
    # Sitecore items only: it runs while Page builder (for the proof variant) isn't connected.
    uses: [sitecore-authoring, blackboard, artifacts]
  - id: prove-personalization
    phase: 7
    # The Editor Experience QA owns Page builder work; the Experience Enabler keeps the items.
    role: editor-experience-qa
    when: personalization
    title: Proof page variant and A/B/n test
    dependsOn: [enable-experience]
    manual: >-
      In Page builder: on one page, create a personalized variant for an audience and an A/B/n
      test on one component, publish, and check both show as configured. Mark it done saying what
      you set up.

  # 8 — Deployment and publishing
  - id: finalize-head
    phase: 8
    role: head-integrator
    title: Finalize production configuration
  # Three separate releases: success in one proves nothing about the others.
  - id: deploy-code
    phase: 8
    role: deployment-engineer
    title: Deploy the reviewed commit to the editing and delivery hosts
    dependsOn: [finalize-head]
    release:
      rollback: Promote the previous production deployment again in Vercel (instant rollback).
    acceptance: [validator:deploy.commit-matches, validator:editing-host.responds]
  - id: serialize-items
    phase: 8
    role: rendering-registrar
    title: Serialize the project's own items into the build repository
    acceptance: [validator:serialization.replays]
  - id: publish-edge
    phase: 8
    role: deployment-engineer
    title: Publish to Experience Edge and verify every route
    dependsOn: [deploy-code]
    release:
      rollback: >-
        Republish the previous item versions, or unpublish the new items; reverting the repository
        doesn't change what Experience Edge serves.
    acceptance: [validator:edge.published, validator:routes.resolve]
  - id: perf-a11y-audit
    phase: 8
    role: perf-a11y-qa
    title: Lighthouse and axe on representative pages
    dependsOn: [publish-edge]
  - id: smoke-test
    phase: 8
    role: editor-experience-qa
    title: Smoke test Page builder on production
    dependsOn: [deploy-code, serialize-items, publish-edge]
    manual: >-
      In Page builder on production: open three pages of different templates, edit a field inline
      on each and undo it, add and remove a component, and check the pages render on the live
      site. Mark it done saying what you checked.

  # 9 — Handover and acceptance (the Director accepts in the live systems; no agent re-checks)
  - id: handover-pack
    phase: 9
    role: handover-writer
    title: Write runbook, component catalog and known-gaps register
