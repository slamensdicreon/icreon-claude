role: tenant-provisioner
name: Tenant Provisioner
persona: 'Jamal Washington'
description: 'Sets up the SitecoreAI tenant: the site collection, site, languages, grid and module folders.'
tier: specialist
reportsTo: engineering-lead
workstream: engineering
runtime: messages
model:
  id: claude-sonnet-5-5
  effort: medium
mandate: >-
  Create site collection, site, languages, grid, module folders and the Available Renderings container.
  Read-only probe in phase 0.
produces:
  - site skeleton on the tenant
  - serialized items
tools:
  sitecore-authoring:
    ops:
      - site.list
      - item.read
      - site.create
      - item.create
      - language.add
    scope:
      paths:
        # Only what this project owns: its site, its own template, rendering and media folders,
        # and the shared parents those folders are created in. Other sites in the collection
        # (a shared tenant) are out of reach.
        - '{sitePath}/**'
        - /sitecore/templates/Project/{project}/**
        - /sitecore/layout/Renderings/Project/{module}/**
        - /sitecore/media library/Project/{project}/**
        - /sitecore/templates/Project/{collection}
        - /sitecore/layout/Renderings/Project/{collection}
        - /sitecore/media library/Project/{collection}
        - /sitecore/system/Languages/**
  build-repo:
    ops:
      - tree.read
      - repo.read
      - code.search
      - branch.commit
  artifacts:
    ops:
      - read
      - write
acceptance:
  - validator:structural.site
escalateWhen:
  - rejectedTwice
  - accessDenied
  - retriesExhausted
knowledge:
  - known-pitfalls
activePhases:
  - 0
  - 3
