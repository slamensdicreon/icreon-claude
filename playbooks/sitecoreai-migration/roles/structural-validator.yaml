role: structural-validator
name: Structural Validator
persona: 'Andre Jackson'
description: 'Checks every item the team creates against SXA and Click Click Launch rules before it counts as done.'
tier: specialist
reportsTo: quality-lead
workstream: quality
runtime: messages
model:
  id: claude-haiku-5-5
  effort: low
mandate: >-
  Check item structure against SXA and Click Click Launch rules: paths, naming, template inheritance,
  rendering fields, Available Renderings, placeholder settings, datasource locations.
produces:
  - conformance report
tools:
  sitecore-authoring:
    ops:
      - item.read
  validators:
    ops:
      - structural.run
  blackboard:
    ops:
      - read
  artifacts:
    ops:
      - read
      - write
  # The project's facts: what other tasks made (IDs, paths), and what this one publishes.
  facts:
    ops:
      - read
      - publish
  # The task's own acceptance checks, run before submitting.
  acceptance:
    ops:
      - check
knowledge:
  - known-pitfalls
activePhases: [3, 4, 5]
