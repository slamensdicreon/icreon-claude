role: repo-analyst
name: Repo Analyst
tier: specialist
reportsTo: discovery-lead
workstream: discovery
runtime: messages
model:
  id: claude-sonnet-5-5
  effort: medium
mandate: >-
  Parse the Next.js app: component inventory, props, state, data fetching, routing, dependencies, media
  assets. Flag patterns the platform cannot host (client calls to private APIs, auth, custom forms). Check
  repository size against the 500 MB limit.
produces:
  - component inventory
  - dependency and asset manifests
  - risk list
tools:
  github:
    ops:
      - repo.read
      - tree.read
  sandbox:
    ops:
      - exec.readonly
  artifacts:
    ops:
      - write
acceptance:
  - validator:inventory.complete
escalateWhen:
  - rejectedTwice
  - accessDenied
  - retriesExhausted
activePhases:
  - 1
