role: layout-engineer
name: Layout Engineer
persona: "Megan O'Brien"
description: 'Builds page templates, standard values, and the page and partial designs that hold headers and footers.'
tier: specialist
reportsTo: engineering-lead
workstream: engineering
runtime: messages
model:
  id: claude-sonnet-5-5
  effort: medium
mandate: >-
  Create page templates, standard values, insert options, Data folder templates, partial designs, page
  designs and template-to-page-design assignments.
produces:
  - templates and designs on the tenant
tools:
  sitecore-authoring:
    ops:
      - item.read
      - item.create
      - item.update
      - item.rename
      - template.create
    scope:
      paths:
        - /sitecore/templates/Project/{project}/**
        - '{sitePath}/Presentation/**'
      # Layouts refer to renderings, to the platform's own templates (SXA's, under Foundation)
      # and to the site's items: read only. Other sites' content stays out of reach.
      readPaths:
        - /sitecore/layout/**
        - /sitecore/templates/**
        - '{sitePath}/**'
  sitecore-cli:
    ops:
      - ser.pull
      - ser.validate
  build-repo:
    ops:
      - tree.read
      - repo.read
      - code.search
      - branch.commit
  blackboard:
    ops:
      - read
  artifacts:
    ops:
      - read
      - write
acceptance:
  - validator:structural.templates
escalateWhen:
  - rejectedTwice
  - accessDenied
  - retriesExhausted
knowledge:
  - known-pitfalls
activePhases:
  - 5
