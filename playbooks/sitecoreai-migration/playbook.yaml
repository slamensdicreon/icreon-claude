# Playbook manifest: what the team delivers, what intake collects, phases and gates. Roles live in
# roles/*.yaml, tasks in plan.yaml. Platform facts (credentials, scopes, pitfalls) come from the
# SitecoreAI platform pack in platforms/sitecoreai.
id: sitecoreai-migration
version: 0.3.0
name: Build a SitecoreAI website
description: >-
  Rebuilds a client's site from its Next.js repository as a Content SDK site on SitecoreAI,
  structured per SXA and Click Click Launch, that marketers can build, personalize and test in Page
  builder, and hands it over running.
platform: sitecoreai
charter:
  mission: >-
    Rebuild the client's site on SitecoreAI so their marketers can build, edit and publish it
    themselves, then hand it over running, documented and owned by the client.
  outcomes:
    - id: marketer-autonomy
      title: Marketers build and edit pages in Page builder without a developer
      measure: >-
        Every Blueprint component is in the toolbox, edits inline, creates useful starter content,
        and a new page's datasource is its own (Definition of Done: inline editing, new component,
        collections, independence).
    - id: content-parity
      title: Everything that should move is on the new site
      measure: >-
        Content parity at or above 98%, every media item uploaded with alt text, no broken internal
        links, every route resolving.
    - id: brand-fidelity
      title: The site looks and behaves like the approved reference
      measure: Visual parity within tolerance at three breakpoints; menus, hero and search behave as the source does.
    - id: quality
      title: Accessible and fast
      measure: The brief's accessibility target and performance budgets met on representative pages, with the reports as evidence.
    - id: release-ready
      title: Releasable and recoverable
      measure: >-
        The reviewed commit runs on the editing and delivery hosts, serialization replays cleanly,
        content is published to Experience Edge, and the runbook covers release and rollback.
    - id: client-ownership
      title: The client owns it
      measure: >-
        The build repository and hosting move to the client, with the component catalog, editor
        guide and known-gaps register delivered.
intake:
  source:
    repo: required
    url: optional
    intro: The code being migrated. Agents read it; the new site is built in a repository of its own.
  steps:
    - title: SitecoreAI
      intro: The SitecoreAI environment the site is built in.
      fields: [cmHost, siteCollection, site, languages]
      credentials:
        - { id: sitecore-environment, required: true }
        - { id: sitecore-organization }
    - title: Edge and hosting
      intro: >-
        Experience Edge Context IDs for the new head, and the Vercel project it deploys to. The
        Context IDs are optional now and can be added later in Settings.
      fields: [hostingProject]
      credentials:
        - { id: edge-preview }
        - { id: edge-live }
  brief:
    - key: personalization
      label: Is Sitecore Personalize licensed and in scope?
      kind: yesno
      required: true
      feature: personalization
      hint: >-
        Installed packages don't prove a licence. Yes adds a proof page variant and an A/B/n test
        to phase 7.
    - key: editorialOperations
      label: What must editors be able to do?
      kind: text
      placeholder: Add, remove and reorder cards; create landing pages; share the header and footer
    - key: integrations
      label: Search, forms, commerce, analytics and consent
      kind: text
      hint: Which are real integrations, and which only look like them on the source site?
    - key: rights
      label: Image and copy rights
      kind: text
      hint: Which assets and copy may move, and who approves them?
    - key: accessibility
      label: Accessibility target
      kind: choice
      options: [WCAG 2.2 AA, WCAG 2.1 AA, Other (see notes)]
      required: true
    - key: performance
      label: Performance budgets
      kind: text
      placeholder: LCP under 2.5 s on mobile; under 200 KB of JavaScript per route
    - key: browsers
      label: Supported browsers and devices
      kind: text
    - key: codeExtraction
      label: May agents read and reuse the source code?
      kind: choice
      options: [Yes, Structure only (no copy or assets from code), No]
      required: true
defaults:
  concurrency: 6
  budgets:
    tokens: 60000000
    usd: 1500
    hours: 40
  escalationDeadlines:
    blocker: 4h
    decision: 2h
    access: 4h
    budget: 1h
    risk: 24h
    gate: 24h
  escalationPolicy:
    blocker:
      { default: false, behaviour: Pauses that path. No default, notifies: 'Immediately, Slack' }
    access: { default: true, behaviour: Proceeds with the default, notifies: 'Immediately, Slack' }
    decision:
      { default: true, behaviour: Proceeds with the default, notifies: 'Digest, unless under 2 h' }
    gate: { default: false, behaviour: Waits for you. No default, notifies: 'Immediately, Slack' }
    budget:
      { default: false, behaviour: Pauses dispatch. No default, notifies: 'Immediately, email' }
    risk: { default: true, behaviour: Proceeds; logged, notifies: Digest }
  stats:
    - {
        metric: components_registered,
        label: Renderings,
        icon: application,
        note: Registered in SitecoreAI,
      }
    - { metric: pages_migrated, label: Pages, icon: document, note: Created in SitecoreAI }
    - { metric: media_uploaded, label: Media, icon: image, note: Uploaded with alt text }
    - { metric: qa_pass, label: QA pass, icon: task--complete, note: Of renderings registered }
  toolLabels:
    browser: Browser
    validators: Validators
    artifacts: Workbench
    blackboard: Blackboard
    decision-log: Decision Log
    model: Model
    plan: Planner
    sitecore-authoring: Authoring API
    sitecore-cli: Sitecore CLI
    sitecore-deploy: Deploy API
    github: GitHub
    build-repo: Build repo
    sandbox: Sandbox
    hosting: Vercel
    research: Docs
phases:
  - number: 0
    name: Intake and access verification
    shortName: Intake
    exitCriteria: >-
      Every credential verified against its endpoint (GitHub clone, Authoring & Management API, Deploy API,
      Experience Edge, hosting); tenant facts recorded; the paths the project owns are fixed, and other
      sites sharing the collection are left alone.
  - number: 1
    name: Discovery and analysis
    shortName: Discovery
    exitCriteria: >-
      Component inventory, page inventory, asset manifest and risk list complete; every sitemap URL crawled
      or marked excluded.
  - number: 2
    name: Blueprint
    shortName: Blueprint
    gate: director
    gateLabel: 'Gate 1: Director approves the Blueprint'
    exitCriteria: >-
      Every source component mapped to a rendering (or merged, split, dropped), every page to a template;
      the model contract approved: exact rendering names, field names and types, child templates with
      their limits, datasource locations, shared or per-page content, and the query budget each
      component must fit; naming and folder scheme fixed; open decisions listed.
  - number: 3
    name: Foundation
    shortName: Foundation
    exitCriteria: >-
      Site, languages and the project's own folders exist; design tokens and shared primitives extracted
      from the source; hosting project and env vars exist; the rendering host key is identical in
      xmcloud.build.json and the host record; an empty page renders on the editing host; zero critical
      findings.
  - number: 4
    name: Component build and registration
    shortName: Components
    optionalGates:
      - pilot-slice-review
    exitCriteria: >-
      Pilot slice proven end to end first: its components ported and registered, a page composed, a
      scoped publish tracked to completion, the layout read back from Experience Edge, and a real Page
      builder edit (including a new page whose datasource is its own). Then 100% of Blueprint components
      ported, registered and enabled in Page builder on the preview editing host.
  - number: 5
    name: Templates, layouts, and designs
    shortName: Templates
    dependsOn:
      - 3
    exitCriteria: >-
      Every page template has standard values, insert options and an assigned page design; header and footer
      partial designs render on every template.
  - number: 6
    name: Content and media migration
    shortName: Migration
    dependsOn:
      - 4
      - 5
    exitCriteria: >-
      Content parity at or above 98%; all media uploaded with alt text; no broken internal links; visual
      sample within tolerance.
  - number: 7
    name: Experience enablement
    shortName: Experience
    exitCriteria: >-
      Components datasource-driven; redirects, SEO fields, sitemap, robots, 404/500, dictionary in place;
      when the brief confirms Personalize is licensed, one page variant and one A/B/n test resolve on
      the preview host.
  - number: 8
    name: Deployment and publishing
    shortName: Deployment
    exitCriteria: >-
      Three releases, each verified on its own: the deployed commit is the reviewed commit on the
      registered editing and delivery hosts; serialization of the project's own items replays cleanly;
      the publish job finished and every route resolves on Experience Edge. Smoke test green.
  - number: 9
    name: Validation and acceptance
    shortName: Acceptance
    gate: director
    gateLabel: 'Gate 2: Director accepts'
    exitCriteria: >-
      Acceptance Report compiled against the Definition of Done, with evidence for every row and
      budgets measured against the brief (a missing test is pending, not passed); every open defect
      triaged as fix, accept or defer.
  - number: 10
    name: Handover
    shortName: Handover
    exitCriteria: >-
      Runbook, marketer component catalog and known-gaps register delivered; project archived with full
      audit trail.
