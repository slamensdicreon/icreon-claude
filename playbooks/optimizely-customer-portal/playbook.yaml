# Playbook manifest for the customer portal on Optimizely CMS (SaaS): the customer portal
# playbook's scope and method (a prototype rebuilt as a portal a presenter walks persona by
# persona, closed by the Director's UAT on production) on the Optimizely team, intake, tools and
# platform order. Roles live in roles/*.yaml, tasks in plan.yaml. Platform facts (credentials,
# scopes, pitfalls) come from the Optimizely platform pack in platforms/optimizely.
#
# What the platform changes:
# - Components are content types defined in code, every key carrying the project's prefix, each
#   with a default display template of its own; the page type is code too. The team creates the
#   portal's application itself, once the page type is pushed, with the dashboard as its start
#   page.
# - The head reads published content only (Optimizely Graph), so the pages are published as they
#   are composed, on the portal's own application and the project's own Vercel addresses.
# - Content by role needs no Optimizely product beyond the CMS: every section's display template
#   carries a `Shown to` setting (everyone, or one role), a marketer sets it in Visual Builder,
#   and the head shows a signed-in persona the sections set to everyone or to their role. So the
#   agents place each role's sections themselves; nothing is left to set up by hand.
# - The sign-in, the sessions, navigation by role and the simulated, resettable data are the
#   head's own code, as on any platform.
# How each portal capability is delivered, and what is still unproven:
# knowledge/portal-on-optimizely.md.
#
# 0.1.1: from the first live run. Model files name a property's options `isRequired` and
# `isLocalized` (the Blueprint's `required` and `localized` are refused by the CMS), a display
# setting's choice key has two characters or more, a new branch starts from the design system, a
# page type an application starts on has no required property, and the push says why the CMS
# refused it.
# 0.1.2: from phases 5 and 6 of the first live run. The editing host is deployed again once the
# application's host is set, an upload carries its alt text (and can be given one later), a `url`
# property is a plain string, a favicon in ICO is not uploaded, and every component is built and
# compared for a phone and a tablet as well as a desktop.
id: optimizely-customer-portal
version: 0.1.2
name: Build an Optimizely CMS (SaaS) customer portal
description: >-
  Rebuilds a client or customer portal prototype as a portal on Optimizely CMS (SaaS): a sign-in
  that looks real and signs into demo personas, navigation by role, pages and words that
  marketers own in Visual Builder, content shown by role, and working journeys on simulated,
  resettable data, ready to present. First version: not yet run on a live project.
platform: optimizely
charter:
  mission: >-
    Turn the client's portal prototype into a portal on Optimizely CMS (SaaS) that a presenter
    can walk persona by persona, where the pages, the words and which role sees which section
    are the marketer's in Visual Builder, and the journeys work end to end on demo data.
  outcomes:
    - id: presentation-path
      title: Every persona's presentation path works on the live site
      measure: >-
        For each persona in the Blueprint: sign in, the role's navigation and dashboard, each
        journey on the path (forms submit, lists update, drawers open), sign out; then Reset demo
        returns every persona to the starting state. The demo accounts sign in and nobody else
        does (portal.sign-in, portal.production); the Director walks each path at Gate 2.
    - id: cms-owned
      title: Optimizely owns the pages, words and images
      measure: >-
        Every portal page is an experience composed of the project's own sections, each a content
        type carrying the project's prefix with a default display template of its own; every
        heading, label, help text, link and image a component shows comes from a property and
        edits inline in live preview; no copy is hard-coded in components (types.pushed,
        editor.element-enabled, structural.experiences, head.preview-route).
    - id: role-aware
      title: Each role sees its own portal
      measure: >-
        Navigation and permitted journeys follow the persona's role in code; content that differs
        by role is a section whose Shown to setting names that role, which a marketer changes in
        Visual Builder, and each persona's pages show their own sections and none of another
        role's (portal.pages-render, portal.role-content when the brief asks for it).
    - id: prototype-fidelity
      title: It looks and behaves like the approved prototype
      measure: Each screen's layout, tokens, imagery and interactions match the prototype at desktop and mobile widths.
    - id: quality
      title: Accessible and robust
      measure: >-
        The brief's accessibility target on every journey (keyboard, focus, labels, contrast);
        empty states and loading states never show another persona's data.
    - id: presentable
      title: Ready to present and hand over
      measure: >-
        The presenter's script per persona, the reset procedure, the Visual Builder moments to
        show, the component catalog and the known gaps are delivered; the reviewed commit runs on
        production and the content model replays from the repository (deploy.commit-matches,
        manifest.replays); and the Director has walked the path on production.
intake:
  source:
    repo: optional
    url: optional
    intro: >-
      The portal prototype: its repository, a running copy of it, or both. Agents read the code
      when there is a repository; without one they rebuild each screen from the running prototype.
      The portal is built in a repository of its own.
  steps:
    - title: Optimizely CMS (SaaS)
      intro: >-
        The CMS instance the portal is built in, the application it becomes, and the prefix its
        content types carry. Content types are shared by every application on the instance; the
        prefix keeps this project's apart. The team creates the application itself. The API key
        needs content rights as well as API access: in the CMS, Settings > Set Access Rights, on
        the Root, give the key Read, Create, Change, Delete and Publish. Without them it can push
        content types and is still refused every content write; the first step of the run asks
        you to confirm them.
      fields: [cmsUrl, application, typePrefix, languages]
      credentials:
        - { id: cms-api-client, required: true }
    - title: Optimizely Graph and hosting
      intro: >-
        The Graph keys the head reads content with, and the Vercel project it deploys to. The app
        key and secret are optional now and can be added later in Settings.
      fields: [hostingProject]
      credentials:
        - { id: graph-single-key, required: true }
        - { id: graph-hmac }
  brief:
    - key: personas
      label: Who signs in, and what does each role do?
      kind: text
      required: true
      placeholder: 'Business manager: claims, coverage and the review queue. Finance contact: billing and wage reporting.'
      hint: One line per persona. Each becomes a demo account with its own navigation and content.
    - key: presentationPath
      label: What does the presenter walk through?
      kind: text
      required: true
      placeholder: Sign in as the manager, report a claim, route an incident; sign out, sign in as finance, pay an invoice.
    - key: personalization
      label: Does content change by role?
      kind: yesno
      required: true
      feature: personalization
      hint: >-
        Yes gives each role its own sections on the pages that differ, each with a Shown to
        setting a marketer changes in Visual Builder. It needs no Optimizely product beyond the
        CMS. If Web or Feature Experimentation is licensed and should decide it instead, say so
        in notes: that is an open decision at Gate 1.
    - key: data
      label: Where does the portal's data come from?
      kind: choice
      required: true
      options:
        - Simulated demo data, resettable
        - Real services (name them in notes)
      hint: Simulated data lives on a demo server the presenter can reset. Real services are open decisions at Gate 1.
    - key: signIn
      label: How do people sign in?
      kind: choice
      required: true
      options:
        - A sign-in screen that signs into demo personas
        - The client's identity provider (name it in notes)
    - key: adminExperience
      label: What should the presentation show in Optimizely?
      kind: text
      placeholder: Visual Builder editing the dashboard, and a section shown to one role
    - key: accessibility
      label: Accessibility target
      kind: choice
      options: [WCAG 2.2 AA, WCAG 2.1 AA, Other (see notes)]
      required: true
    - key: codeExtraction
      label: May agents read and reuse the prototype's code?
      kind: choice
      options: [Yes, Structure only (no copy or assets from code), No]
      required: true
      when: source-repo
defaults:
  concurrency: 6
  # Who may settle each category of card. The Lead settles the categories it can (it sees the
  # Blueprint, the rules, the project's decisions and the team's lessons) and forwards to the
  # Director what is theirs; a Director can set any category back to shadow or ask in Settings.
  # Five projects' shadow answers showed the Lead right or nearly right on most retry,
  # ownership and naming cards. Access, scope, releases and anything unclassified always ask.
  autonomy:
    media: lead
    tool: lead
    retry: lead
    ownership: lead
    naming: lead
    content: lead
    access: ask
    scope: ask
    release: ask
    other: ask
  # The same budgets as the customer portal on the other platform, until timed runs.
  budgets:
    tokens: 40000000
    usd: 1000
    hours: 30
  escalationDeadlines:
    blocker: 4h
    decision: 2h
    access: 4h
    budget: 1h
    risk: 24h
    gate: 24h
  escalationPolicy:
    blocker:
      { default: false, behaviour: Pauses that path. No default, notifies: 'Immediately, Slack' }
    access: { default: true, behaviour: Proceeds with the default, notifies: 'Immediately, Slack' }
    decision:
      { default: true, behaviour: Proceeds with the default, notifies: 'Digest, unless under 2 h' }
    gate: { default: false, behaviour: Waits for you. No default, notifies: 'Immediately, Slack' }
    budget:
      { default: false, behaviour: Pauses dispatch. No default, notifies: 'Immediately, email' }
    risk: { default: true, behaviour: Proceeds; logged, notifies: Digest }
  stats:
    - {
        metric: components_registered,
        label: Content types,
        icon: application,
        note: Pushed to the CMS and offered in Visual Builder,
      }
    - { metric: pages_migrated, label: Pages, icon: document, note: Composed and published }
    - { metric: media_uploaded, label: Media, icon: image, note: Uploaded with alt text }
    - { metric: qa_pass, label: QA pass, icon: task--complete, note: Of content types pushed }
  toolLabels:
    browser: Browser
    validators: Validators
    artifacts: Workbench
    blackboard: Blackboard
    decision-log: Decision Log
    model: Model
    plan: Planner
    optimizely-cms: CMS REST API
    optimizely-graph: Optimizely Graph
    github: GitHub
    build-repo: Build repo
    sandbox: Sandbox
    hosting: Vercel
    research: Docs
phases:
  - number: 0
    name: Intake and access verification
    shortName: Intake
    exitCriteria: >-
      Every credential verified against its endpoint (GitHub clone, CMS REST API v1, Optimizely
      Graph, hosting); instance facts recorded (applications, locales, content types already
      carrying the prefix); the API key's content rights confirmed by the Director or proven by
      the key's earlier content; the application and prefix the project owns are fixed, and other
      applications on the instance are left alone.
  - number: 1
    name: Prototype discovery
    shortName: Discovery
    exitCriteria: >-
      Every screen of the prototype inventoried with its route, copy, components and the personas
      who see it; every persona with its role, navigation and journeys; every interaction and the
      data it reads or changes; the design system and media listed; risks noted.
  - number: 2
    name: Blueprint
    shortName: Blueprint
    gate: director
    gateLabel: 'Gate 1: Director approves the Blueprint'
    exitCriteria: >-
      Every screen mapped to a page and every block to a content type with its model contract
      (the key with the prefix, properties, a default display template with the column and
      audience settings); the one page type every page uses; each persona specified (demo
      account, role, audience, navigation, presentation path, the content that differs for them);
      each page's sections with the role each is shown to; what Optimizely owns and what the demo
      server owns decided per component; open decisions listed (real services, identity
      provider, Optimizely's experimentation products).
  - number: 3
    name: Foundation
    shortName: Foundation
    exitCriteria: >-
      The design system is extracted; the portal shell builds green (sign-in into demo personas,
      signed sessions, the sign-in gate, navigation by role, the demo data service with reset,
      the section wrapper that shows a section to the roles it is set for); the head is hosted on
      Vercel with its private demo data store and Vercel Authentication off, so Visual Builder
      can frame it.
  # The application is made here, not in Foundation: it needs its start page to exist, and the
  # start page is the dashboard, of the page type the Blueprint names. That type is code.
  - number: 4
    name: Components, the page type and the application
    shortName: Components
    optionalGates:
      - pilot-slice-review
    exitCriteria: >-
      Pilot slice proven first: its components built, pushed and on the editing address, the page
      type pushed, the application created with its hosts and live preview, a pilot page
      composed, published and rendered for a signed-in persona, the demo accounts signing in.
      Then every Blueprint component built, its content type and display template pushed under
      the project's prefix, and its code on the editing address.
  - number: 5
    name: Pages, media and role content
    shortName: Pages
    exitCriteria: >-
      Every Blueprint page exists under the start page, composed from the prototype's copy and
      published; every image uploaded with alt text; each page renders on the editing address for
      a persona who may open it; when the brief asks for it, each role's own sections are on
      their pages, each persona sees theirs and none of another role's, and the role content
      plan is written.
  - number: 6
    name: Release
    shortName: Release
    exitCriteria: >-
      The reviewed commit runs on production and the editing address, with the demo data store
      connected; the content model replays from the repository; every page's final version is
      published and indexed in Optimizely Graph, and the portal signs its personas in on
      production.
  # The project closes on the Director's UAT of the portal as built, on production, against the
  # UAT checklist and the presenter script in the handover pack.
  - number: 7
    name: UAT and presentation readiness
    shortName: UAT
    gate: director
    gateLabel: 'Gate 2: Director UAT and acceptance'
    exitCriteria: >-
      Presenter script, UAT checklist, reset procedure, component catalog, decision register and
      known gaps delivered; the Director has walked every persona's presentation path on
      production, run the Visual Builder UAT (an inline edit, a section added, a section's
      audience changed and seen by that role), sent every failure back until it passed, reset
      the demo, and accepts.
