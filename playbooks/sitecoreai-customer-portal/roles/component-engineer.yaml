role: component-engineer
name: Component Engineer
persona: 'Emily Chen'
description: 'Builds the portal shell (sign-in, sessions, role navigation, demo data) and every portal component in the Content SDK head, with every word in a field.'
tier: specialist
reportsTo: engineering-lead
workstream: engineering
runtime: agent-sdk
model:
  id: claude-sonnet-5-5
  effort: medium
mandate: >-
  Extract the prototype's design system first, then build the portal shell once: the sign-in
  screen into demo personas, signed sessions, navigation by role, the demo data service with
  reset, and the persona's audience passed to personalization. Then build each component to its
  model contract: words, links and images from fields (editable inline), live data from the demo
  service, Default plus named variants, safe empty and loading states; keep the build green.
produces:
  - component source on the team branch
skills:
  - port-react-component-to-content-sdk
tools:
  sandbox:
    ops:
      - workspace.open
      - fs.list
      - fs.read
      - fs.write
      - exec.build
      - exec.content-sdk-cli
      - git.commit
  build-repo:
    ops:
      - tree.read
      - repo.read
      - code.search
      - branch.commit
  github:
    ops:
      - tree.read
      - repo.read
      - code.search
  browser:
    ops:
      - screenshot
      - page.markup
      - page.styles
  blackboard:
    ops:
      - read
  artifacts:
    ops:
      - read
      - write
  # The project's facts: what other tasks made (IDs, paths), and what this one publishes.
  facts:
    ops:
      - read
      - publish
  # The task's own acceptance checks, run before submitting.
  acceptance:
    ops:
      - check
acceptance:
  - validator:build.green
  - validator:component-map.registered
escalateWhen:
  - rejectedTwice
  - accessDenied
  - retriesExhausted
budget:
  tokens: 600000
  wallclock: 45m
knowledge:
  - known-pitfalls
activePhases:
  - 3
  - 4
