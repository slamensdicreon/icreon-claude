<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Eye</title></head>
<body style="margin: 0; padding: 24px; font-family: var(--font-sans, 'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif); color: var(--ink, #141433); background: var(--bliss, #f6f5fc); display: flex; align-items: center; justify-content: space-around; gap: 24px">
  <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <svg width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="Resting"><circle cx="36" cy="36" r="31" fill="var(--ink, #141433)"/><path d="M20 36 Q36 50 52 36" fill="none" stroke="var(--on-ink, #ffffff)" stroke-width="4" stroke-linecap="round"/></svg>
    <figcaption style="font-size: 13px; font-weight: 700">Resting</figcaption>
  </figure>
  <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <svg width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="Watching"><circle cx="36" cy="36" r="31" fill="var(--ink, #141433)"/><path d="M18 36 Q36 20 54 36 Q36 52 18 36 Z" fill="none" stroke="var(--on-ink, #ffffff)" stroke-width="3.5" stroke-linejoin="round"/><circle cx="36" cy="36" r="5" fill="var(--on-ink, #ffffff)"/></svg>
    <figcaption style="font-size: 13px; font-weight: 700">Watching</figcaption>
  </figure>
  <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <span style="position: relative; width: 120px; height: 120px; display: inline-flex; align-items: center; justify-content: center">
      <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 999px; background: var(--coral-halo, #fbd9d1)"></span>
      <span aria-hidden="true" style="position: absolute; inset: 16px; border-radius: 999px; background: var(--surface, #ffffff)"></span>
      <svg width="76" height="76" viewBox="0 0 72 72" role="img" aria-label="Needs a word" style="position: relative"><circle cx="36" cy="36" r="31" fill="var(--coral, #e8553d)"/><path d="M18 36 Q36 20 54 36 Q36 52 18 36 Z" fill="var(--on-ink, #ffffff)"/><circle cx="36" cy="36" r="7" fill="var(--ink, #141433)"/></svg>
    </span>
    <figcaption style="font-size: 13px; font-weight: 700; color: var(--coral-text, #c8402b)">Needs a word, with the halo</figcaption>
  </figure>
</body>
