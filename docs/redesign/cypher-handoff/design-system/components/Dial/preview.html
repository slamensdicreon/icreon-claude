<!-- @dsCard group="Controls" height=120 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dial</title></head>
<body style="margin: 0; padding: 24px; font-family: var(--font-sans, 'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif); display: flex; align-items: center; justify-content: space-around; gap: 24px; background: var(--bliss, #f6f5fc)">
  <div role="group" aria-label="How much to show" style="display: inline-flex; align-items: center; padding: 4px; border-radius: 999px; background: var(--surface, #ffffff); border: 1px solid var(--mist, #e3e0f2)">
    <button aria-pressed="true" style="font: inherit; font-size: 15px; font-weight: 700; padding: 8px 20px; border-radius: 999px; border: 0; background: var(--ink, #141433); color: var(--on-ink, #ffffff); cursor: pointer">Bliss</button>
    <button aria-pressed="false" style="font: inherit; font-size: 15px; font-weight: 500; padding: 8px 20px; border-radius: 999px; border: 0; background: transparent; color: var(--text-3, #6a6889); cursor: pointer">Everything</button>
  </div>
  <div style="padding: 20px 28px; border-radius: 18px; background: var(--ink, #141433)">
    <div role="group" aria-label="How much to show" style="display: inline-flex; align-items: center; padding: 4px; border-radius: 999px; background: var(--ink-2, #1d1d45)">
      <button aria-pressed="false" style="font: inherit; font-size: 15px; font-weight: 500; padding: 8px 20px; border-radius: 999px; border: 0; background: transparent; color: var(--on-ink-muted, #b7a6ff); cursor: pointer">Bliss</button>
      <button aria-pressed="true" style="font: inherit; font-size: 15px; font-weight: 700; padding: 8px 20px; border-radius: 999px; border: 0; background: var(--surface, #ffffff); color: var(--ink, #141433); cursor: pointer">Everything</button>
    </div>
  </div>
</body>
</html>
